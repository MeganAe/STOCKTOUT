name: stocktout
description: Logiciel de gestion de stock multi-plateforme pour tout type de commerce.
publish_to: "none"
version: 1.6.3+15

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  sqflite_common_ffi: ^2.3.3
  sqlite3: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  collection: ^1.18.0
  csv: ^6.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  excel: ^4.0.6
  file_picker: ^8.0.3
  window_manager: ^0.3.8
  package_info_plus: ^8.0.0
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  path_provider_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - l10n/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-latin-400.ttf
          weight: 400
        - asset: assets/fonts/inter-latin-500.ttf
          weight: 500
        - asset: assets/fonts/inter-latin-600.ttf
          weight: 600
        - asset: assets/fonts/inter-latin-700.ttf
          weight: 700
    - family: InterExt
      fonts:
        - asset: assets/fonts/inter-latin-ext-400.ttf
          weight: 400
        - asset: assets/fonts/inter-latin-ext-500.ttf
          weight: 500
        - asset: assets/fonts/inter-latin-ext-600.ttf
          weight: 600
        - asset: assets/fonts/inter-latin-ext-700.ttf
          weight: 700
