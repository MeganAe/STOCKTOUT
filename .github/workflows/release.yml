name: Release

# Compilation + publication manuelle multi-plateforme / multi-architecture.
# Lancement : onglet Actions > Release > Run workflow.
#
# Produit :
#  - Windows x64 : installeur Setup.exe (Inno Setup) + ZIP portable
#  - macOS Intel (x64) + Silicon (arm64) : DMG + ZIP
#  - Linux x64 : .tar.gz + .deb
#  - Android : APK (toujours) + AAB (si secrets keystore configures)
#
# Non inclus (documente dans docs/BUILD.md) :
#  - Windows ARM64 : le runner windows-11-arm n'a que Visual Studio 2026,
#    que Flutter 3.24 ne sait pas utiliser. A re-essayer apres montee
#    de version Flutter (le SDK x64 suffit, le build ARM64 est natif).
#  - Linux ARM64 : Flutter ne publie pas de SDK Linux ARM64.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.3.0). Laisse vide pour utiliser pubspec.yaml"
        required: false
        default: ""
        type: string
      platforms:
        description: "Plateformes a compiler"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
          - android
      draft:
        description: "Creer la release en brouillon ? (sinon publiee directement)"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Marquer comme pre-release ?"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.3"
  APP_NAME: stocktout

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1 | tr -d ' "')
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # ---------------- WINDOWS ----------------
  windows-x64:
    if: inputs.platforms == 'all' || inputs.platforms == 'windows'
    needs: resolve-version
    # windows-2022 et non windows-latest : le -latest (Server 2025 + VS2026)
    # n'est pas reconnu par Flutter 3.24 ("could not find any instance
    # of Visual Studio"). windows-2022 = VS2022, combo eprouve.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package ZIP (x64)
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.version }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "${{ env.APP_NAME }}-windows-x64-$ver.zip"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.version }}"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc "packaging/windows/installer.iss" /DAppVersion=$ver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "${{ env.APP_NAME }}-windows-x64-$ver-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.APP_NAME }}-windows-x64-*

  # ---------------- macOS ----------------
  macos-x64:
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    needs: resolve-version
    # macos-13 est retire par GitHub. macos-15-intel = dernier runner
    # Intel, dispo jusqu'aout 2027.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package ZIP
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent ./*.app ../../../../../${{ env.APP_NAME }}-macos-x64-$VER.zip
      - name: Build DMG
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          brew install create-dmg
          create-dmg \
            --volname "StockTout" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "StockTout.app" 150 185 \
            --hide-extension "StockTout.app" \
            --app-drop-link 450 185 \
            "${{ env.APP_NAME }}-macos-x64-$VER.dmg" \
            "build/macos/Build/Products/Release/StockTout.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: ${{ env.APP_NAME }}-macos-x64-*

  macos-arm64:
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    needs: resolve-version
    # macos-14 retire le 2 nov. 2026. macos-15 = meme generation Xcode,
    # compatible Flutter 3.24.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: arm64
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package ZIP
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent ./*.app ../../../../../${{ env.APP_NAME }}-macos-arm64-$VER.zip
      - name: Build DMG
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          brew install create-dmg
          create-dmg \
            --volname "StockTout" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "StockTout.app" 150 185 \
            --hide-extension "StockTout.app" \
            --app-drop-link 450 185 \
            "${{ env.APP_NAME }}-macos-arm64-$VER.dmg" \
            "build/macos/Build/Products/Release/StockTout.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ env.APP_NAME }}-macos-arm64-*

  # ---------------- LINUX ----------------
  linux-x64:
    if: inputs.platforms == 'all' || inputs.platforms == 'linux'
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package tar.gz
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          tar -czvf ${{ env.APP_NAME }}-linux-x64-$VER.tar.gz -C build/linux/x64/release bundle
      - name: Build .deb (Ubuntu/Debian)
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          PKG=pkgdeb
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/lib/stocktout" "$PKG/usr/bin" \
            "$PKG/usr/share/applications" \
            "$PKG/usr/share/icons/hicolor/48x48/apps" \
            "$PKG/usr/share/icons/hicolor/64x64/apps" \
            "$PKG/usr/share/icons/hicolor/128x128/apps" \
            "$PKG/usr/share/icons/hicolor/256x256/apps" \
            "$PKG/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/x64/release/bundle/. "$PKG/usr/lib/stocktout/"
          ln -s /usr/lib/stocktout/stocktout "$PKG/usr/bin/stocktout"
          cp packaging/linux/stocktout.desktop "$PKG/usr/share/applications/"
          for s in 48 64 128 256 512; do
            cp "assets/icons/png/appicon_$s.png" \
              "$PKG/usr/share/icons/hicolor/${s}x${s}/apps/stocktout.png"
          done
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: stocktout
          Version: $VER
          Section: office
          Priority: optional
          Architecture: amd64
          Maintainer: Metoushela Walker
          Depends: libgtk-3-0, libblkid1, liblzma5, libsqlite3-0
          Recommends: zenity
          Description: Logiciel de gestion de stock
           StockTout : produits, stock, caisse, achats, rapports. Hors-ligne.
          EOF
          dpkg-deb --build "$PKG" "${{ env.APP_NAME }}-linux-x64-$VER-amd64.deb"
          ls -lh ./*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.APP_NAME }}-linux-x64-*

  # ---------------- ANDROID ----------------
  android:
    if: inputs.platforms == 'all' || inputs.platforms == 'android'
    needs: resolve-version
    runs-on: ubuntu-latest
    # "secrets" n'est pas autorise dans un if: -> on calcule le drapeau ici.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      # AGP 8 (Flutter 3.24) exige JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
      - run: flutter pub get
      - name: Restore keystore (optional)
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            echo "Keystore restaure : signature release."
          else
            echo "Pas de secrets keystore : APK signe en debug."
          fi
      - name: Build APK
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk \
            ${{ env.APP_NAME }}-android-$VER.apk
          ls -lh ./*.apk
      # AAB (Play Store) uniquement si signature release disponible :
      # un AAB signe en debug est refuse par Google Play.
      - name: Build AAB (Play Store)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          flutter build appbundle --release
          mv build/app/outputs/bundle/release/app-release.aab \
            ${{ env.APP_NAME }}-android-$VER.aab
          ls -lh ./*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ env.APP_NAME }}-android-*

  # ---------------- PUBLICATION ----------------
  publish:
    needs:
      - resolve-version
      - windows-x64
      - macos-x64
      - macos-arm64
      - linux-x64
      - android
    if: always() && needs.resolve-version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: StockTout v${{ needs.resolve-version.outputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
          body: |
            ## StockTout v${{ needs.resolve-version.outputs.version }}

            ### Telechargements
            | Systeme | Format | Fichier |
            |---|---|---|
            | Windows | Installeur (recommande) | `stocktout-windows-x64-${{ needs.resolve-version.outputs.version }}-setup.exe` |
            | Windows | Portable | `stocktout-windows-x64-${{ needs.resolve-version.outputs.version }}.zip` |
            | macOS Intel | DMG (recommande) | `stocktout-macos-x64-${{ needs.resolve-version.outputs.version }}.dmg` |
            | macOS Intel | ZIP | `stocktout-macos-x64-${{ needs.resolve-version.outputs.version }}.zip` |
            | macOS Silicon | DMG (recommande) | `stocktout-macos-arm64-${{ needs.resolve-version.outputs.version }}.dmg` |
            | macOS Silicon | ZIP | `stocktout-macos-arm64-${{ needs.resolve-version.outputs.version }}.zip` |
            | Linux | Archive | `stocktout-linux-x64-${{ needs.resolve-version.outputs.version }}.tar.gz` |
            | Linux | Paquet Ubuntu/Debian | `stocktout-linux-x64-${{ needs.resolve-version.outputs.version }}-amd64.deb` |
            | Android | APK | `stocktout-android-${{ needs.resolve-version.outputs.version }}.apk` |
            | Android | AAB Play Store (si keystore) | `stocktout-android-${{ needs.resolve-version.outputs.version }}.aab` |

            ### Installation
            - **Windows** : lancez le `*-setup.exe` (assistant en francais, raccourcis + desinstallation inclus). Ou decompressez le ZIP portable.
            - **macOS** : ouvrez le DMG, glissez `StockTout` vers Applications. Au premier lancement, clic droit > Ouvrir.
            - **Linux** : `sudo dpkg -i stocktout-linux-*-amd64.deb` (recommande, menu + icone). Ou archive : `tar -xzf stocktout-linux-*.tar.gz && ./stocktout/stocktout`
            - **Android** : copiez l'APK sur le telephone et ouvrez-le (autoriser « sources inconnues » si demande). Aucune permission requise, 100 % hors-ligne.

            > Builds produits automatiquement par le workflow manuel `Release`.
            > Non inclus : Windows ARM64 (VS2026 non reconnu par Flutter 3.24)
            > et Linux ARM64 (pas de SDK officiel).
