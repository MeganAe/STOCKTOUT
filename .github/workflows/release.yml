name: Release

# Compilation + publication manuelle multi-plateforme / multi-architecture.
# Lancement : onglet Actions > Release > Run workflow.
#
# Produit :
#  - Windows x64 : installeur Setup.exe (Inno Setup) + ZIP portable
#  - macOS Intel (x64) + Silicon (arm64) : DMG + ZIP
#  - Linux x64 : .tar.gz
#
# Non inclus (documente dans docs/BUILD.md) :
#  - Windows ARM64 : le runner windows-11-arm n'a que Visual Studio 2026,
#    que Flutter 3.24 ne sait pas utiliser. A re-essayer apres montee
#    de version Flutter (le SDK x64 suffit, le build ARM64 est natif).
#  - Linux ARM64 : Flutter ne publie pas de SDK Linux ARM64.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.3.0). Laisse vide pour utiliser pubspec.yaml"
        required: false
        default: ""
        type: string
      platforms:
        description: "Plateformes a compiler"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      draft:
        description: "Creer la release en brouillon ? (sinon publiee directement)"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Marquer comme pre-release ?"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.3"
  APP_NAME: stocktout

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1 | tr -d ' "')
            echo "version=$VER" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

  # ---------------- WINDOWS ----------------
  windows-x64:
    if: inputs.platforms == 'all' || inputs.platforms == 'windows'
    needs: resolve-version
    # windows-2022 et non windows-latest : le -latest (Server 2025 + VS2026)
    # n'est pas reconnu par Flutter 3.24 ("could not find any instance
    # of Visual Studio"). windows-2022 = VS2022, combo eprouve.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package ZIP (x64)
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.version }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "${{ env.APP_NAME }}-windows-x64-$ver.zip"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.version }}"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc "packaging/windows/installer.iss" /DAppVersion=$ver
          Get-Item "${{ env.APP_NAME }}-windows-x64-$ver-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.APP_NAME }}-windows-x64-*

  # ---------------- macOS ----------------
  macos-x64:
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    needs: resolve-version
    # macos-13 est retire par GitHub. macos-15-intel = dernier runner
    # Intel, dispo jusqu'aout 2027.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package ZIP
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent *.app ../../../../../${{ env.APP_NAME }}-macos-x64-$VER.zip
      - name: Build DMG
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          brew install create-dmg
          create-dmg \
            --volname "StockTout" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "StockTout.app" 150 185 \
            --hide-extension "StockTout.app" \
            --app-drop-link 450 185 \
            "${{ env.APP_NAME }}-macos-x64-$VER.dmg" \
            "build/macos/Build/Products/Release/StockTout.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: ${{ env.APP_NAME }}-macos-x64-*

  macos-arm64:
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    needs: resolve-version
    # macos-14 retire le 2 nov. 2026. macos-15 = meme generation Xcode,
    # compatible Flutter 3.24.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: arm64
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package ZIP
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent *.app ../../../../../${{ env.APP_NAME }}-macos-arm64-$VER.zip
      - name: Build DMG
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          brew install create-dmg
          create-dmg \
            --volname "StockTout" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "StockTout.app" 150 185 \
            --hide-extension "StockTout.app" \
            --app-drop-link 450 185 \
            "${{ env.APP_NAME }}-macos-arm64-$VER.dmg" \
            "build/macos/Build/Products/Release/StockTout.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ env.APP_NAME }}-macos-arm64-*

  # ---------------- LINUX ----------------
  linux-x64:
    if: inputs.platforms == 'all' || inputs.platforms == 'linux'
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package tar.gz
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          tar -czvf ${{ env.APP_NAME }}-linux-x64-$VER.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.APP_NAME }}-linux-x64-*.tar.gz

  # ---------------- PUBLICATION ----------------
  publish:
    needs:
      - resolve-version
      - windows-x64
      - macos-x64
      - macos-arm64
      - linux-x64
    if: always() && needs.resolve-version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: StockTout v${{ needs.resolve-version.outputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
          body: |
            ## StockTout v${{ needs.resolve-version.outputs.version }}

            ### Telechargements
            | Systeme | Format | Fichier |
            |---|---|---|
            | Windows | Installeur (recommande) | `stocktout-windows-x64-${{ needs.resolve-version.outputs.version }}-setup.exe` |
            | Windows | Portable | `stocktout-windows-x64-${{ needs.resolve-version.outputs.version }}.zip` |
            | macOS Intel | DMG (recommande) | `stocktout-macos-x64-${{ needs.resolve-version.outputs.version }}.dmg` |
            | macOS Intel | ZIP | `stocktout-macos-x64-${{ needs.resolve-version.outputs.version }}.zip` |
            | macOS Silicon | DMG (recommande) | `stocktout-macos-arm64-${{ needs.resolve-version.outputs.version }}.dmg` |
            | macOS Silicon | ZIP | `stocktout-macos-arm64-${{ needs.resolve-version.outputs.version }}.zip` |
            | Linux | Archive | `stocktout-linux-x64-${{ needs.resolve-version.outputs.version }}.tar.gz` |

            ### Installation
            - **Windows** : lancez le `*-setup.exe` (assistant en francais, raccourcis + desinstallation inclus). Ou decompressez le ZIP portable.
            - **macOS** : ouvrez le DMG, glissez `StockTout` vers Applications. Au premier lancement, clic droit > Ouvrir.
            - **Linux** : `tar -xzf stocktout-linux-*.tar.gz && ./stocktout/stocktout`

            > Builds produits automatiquement par le workflow manuel `Release`.
            > Non inclus : Windows ARM64 (VS2026 non reconnu par Flutter 3.24)
            > et Linux ARM64 (pas de SDK officiel).
